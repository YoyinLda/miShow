name: Scrape PuntoTicket

# Scraping programado de PuntoTicket con persistencia idempotente en Supabase.
# Cubre el catálogo completo de /musica: el listado entrega ~48 eventos en un
# solo HTML (la paginación del sitio es cosmética), así que se hace 1 request al
# listado y 1 request de detalle por evento, con throttling responsable
# (concurrency 2, delay 1500ms). 2 corridas/día, 1 sola fuente.
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL         URL de la Data API del proyecto Supabase (https://<ref>.supabase.co)
#   SUPABASE_SECRET_KEY  Secret key del servidor (NUNCA una clave publishable/anon)
#
# Variables opcionales (Settings -> Secrets and variables -> Actions -> Variables)
# para ajustar cobertura sin editar este archivo:
#   MAX_EVENTS         Eventos a procesar por corrida (default 60).
#   MAX_EVENTS_LIMIT   Tope duro de seguridad (default 200).
#
# La corrida falla visiblemente si el scraper termina con exit code != 0
# (fallo global o corrida totalmente fallida), de modo que los problemas quedan
# detectables desde la pestaña Actions sin revisión manual diaria.

on:
  schedule:
    # Horarios en UTC. Chile: UTC-3 (verano) / UTC-4 (invierno).
    # 12:00 UTC -> ~08:00-09:00 en Chile (mañana).
    # 22:00 UTC -> ~18:00-19:00 en Chile (tarde/noche).
    - cron: "0 12 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

# Evita que dos corridas del scraper se solapen; si llega una nueva mientras otra
# sigue en curso, se cancela la anterior para no acumular backlog ni consumo.
concurrency:
  group: scrape-puntoticket
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape and persist (PuntoTicket)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Cobertura configurable por variables del repositorio; el scraper usa
          # estos valores como default (el flag CLI, si existiera, tendría prioridad).
          MAX_EVENTS: ${{ vars.MAX_EVENTS || '60' }}
          MAX_EVENTS_LIMIT: ${{ vars.MAX_EVENTS_LIMIT || '200' }}
        run: >-
          npm --silent run puntoticket:scrape --
          --live
          --persist
          --concurrency 2
          --delay-ms 1500
          --timeout-ms 15000
